[pytest]
pythonpath = .
testpaths = tests
addopts = -m "not integration and not live" -ra
markers =
    unit: sin Mongo ni servicios externos.
    contract: congelan contrato HTTP, OpenAPI y auth.
    integration: requieren MongoDB local (siempre la base de test).
    live: requieren servicios externos reales (Autenticador, SSO).
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
