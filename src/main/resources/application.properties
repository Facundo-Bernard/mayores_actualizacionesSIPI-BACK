spring.application.name=prueba2
server.port=${PORT:3000}

# Import opcional de archivo .env (no falla si no existe)
spring.config.import=optional:file:./.env[.properties]

# Tolerancia a la ausencia del archivo .env físico en Docker
spring.dotenv.enabled=true
spring.dotenv.ignoreIfMissing=true

# ==========================================
# CONFIGURACION BASE DE DATOS (Variables de Entorno desde .env)
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/prueba2?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# ==========================================
# MIGRACIONES FLYWAY (Proteccion para Produccion)
# ==========================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# ==========================================
# JWT & SEGURIDAD
# ==========================================
# Clave secreta HMAC-SHA256 (OBLIGATORIO en produccion, sin valor por defecto por seguridad)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-days=180

# URL del Frontend (para armar el Magic Link enviado por correo)
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# ==========================================
# CORREO ELECTRONICO (Brevo / SMTP Relay)
# ==========================================
spring.mail.host=${SPRING_MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${APP_MAIL_FROM}