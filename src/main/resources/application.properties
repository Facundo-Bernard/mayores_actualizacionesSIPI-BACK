spring.application.name=prueba2
server.port=${PORT:8080}

# ==========================================
# CONFIGURACION PRODUCCION (Variables de Entorno)
# ==========================================
# spring.datasource.url=${SPRING_DATASOURCE_URL}
# spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
# spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# CONFIGURACION LOCAL
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/prueba2?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# ==========================================
# MIGRACIONES FLYWAY (Proteccion para Produccion)
# ==========================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# ==========================================
# JWT & SEGURIDAD
# ==========================================
# Clave secreta HMAC-SHA256 (en produccion sobreescribir con variable de entorno JWT_SECRET)
app.jwt.secret=${JWT_SECRET:c2VjcmV0LWtleS1mb3ItbWF5b3Jlcy1hY3R1YWxpemFjaW9uZXMtYmFja2VuZC0yMDI2LXNpcGk=}
app.jwt.expiration-days=180

# URL del Frontend (para armar el Magic Link enviado por correo)
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# ==========================================
# CORREO ELECTRONICO (Spring Mail)
# ==========================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true