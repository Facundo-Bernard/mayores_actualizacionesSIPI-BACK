version: '3.8'

services:
  backend:
    build: .
    container_name: spring-boot-backend
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Variables de entorno adicionales o sobrescrituras
      - SPRING_PROFILES_ACTIVE=production
      # Confía en headers X-Forwarded-* de IIS
      - SERVER_FORWARD_HEADERS_STRATEGY=framework
    restart: unless-stopped
    networks:
      - app-network
    # Permite acceso a servicios locales del host (MySQL en host.docker.internal)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  app-network:
    driver: bridge