services:
  # 1. Backend FastAPI (Python)
  backend:
    build: .
    container_name: mayores-actualizaciones-backend
    restart: unless-stopped
    ports:
      - "8082:8082"                       # Puerto expuesto para Nginx / acceso externo
    env_file:
      - .env                              # Carga automática de variables de entorno
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - PORT=8082
      - HOST=0.0.0.0
    depends_on:
      - mongodb

  # 3. Base de Datos MongoDB
  mongodb:
    image: mongo:7.0
    container_name: mayores-actualizaciones-mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db               # Persistencia de datos

volumes:
  mongo_data:
